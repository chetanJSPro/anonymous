<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niche Pilot Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page:           #f9f9f7;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:           #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --good:           #006300;

    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
    --series-5: #e87ba4; --series-6: #008300; --series-7: #4a3aa7; --series-8: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid:           #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --good:           #0ca30c;

      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
      --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--text-primary);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }
  header { margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--text-secondary); font-size: 14px; }
  .pill {
    display: inline-block; margin-top: 10px; padding: 4px 10px; border-radius: 999px;
    background: var(--surface-1); border: 1px solid var(--border); font-size: 13px; color: var(--text-secondary);
  }
  .pill b { color: var(--text-primary); }

  .cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px; margin: 24px 0;
  }
  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
  }
  .card .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .card .niche { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .card .value { font-size: 24px; font-variant-numeric: tabular-nums; }
  .card .delta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .card .rank { float: right; font-size: 12px; color: var(--text-muted); }

  section { margin: 36px 0; }
  h2 { font-size: 16px; margin: 0 0 14px; }

  .chart { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 20px; overflow-x: auto; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  .bar-label { width: 220px; flex: 0 0 220px; font-size: 13px; color: var(--text-secondary); text-align: right; }
  .bar-track { flex: 1; background: var(--page); border-radius: 4px; height: 20px; position: relative; }
  .bar-fill { height: 20px; border-radius: 4px; min-width: 4px; }
  .bar-value { margin-left: 8px; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text-primary); white-space: nowrap; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; font-variant-numeric: normal; }
  th { color: var(--text-muted); font-weight: 600; cursor: pointer; user-select: none; }
  th:hover { color: var(--text-primary); }
  tbody tr:hover { background: var(--page); }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 7px; }

  .empty { color: var(--text-muted); font-size: 14px; padding: 40px 0; text-align: center; }
  footer { color: var(--text-muted); font-size: 12px; margin-top: 40px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Niche Pilot Dashboard</h1>
    <div class="sub">8 faceless channels, one Google account, 2-week trial &mdash; which niche earns its slot?</div>
    <div class="pill" id="pilotPill">loading…</div>
  </header>

  <div id="content">
    <div class="empty">Loading data/stats.json…</div>
  </div>

  <footer id="lastUpdated"></footer>
</div>

<script>
const SERIES = ['--series-1','--series-2','--series-3','--series-4','--series-5','--series-6','--series-7','--series-8'];
function seriesColor(i) {
  return getComputedStyle(document.documentElement).getPropertyValue(SERIES[i % SERIES.length]).trim();
}
function fmt(n) {
  if (n == null) return '—';
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return String(Math.round(n));
}
function money(n) {
  if (n == null) return '—';
  return '$' + n.toFixed(2);
}

async function main() {
  let data;
  try {
    const res = await fetch('data/stats.json', {cache: 'no-store'});
    data = await res.json();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="empty">No data yet — the analytics workflow hasn\'t run, or channels aren\'t authorized. See SETUP.md.</div>';
    return;
  }

  const channels = data.channels || {};
  const records = data.records || [];
  const names = Object.keys(channels);

  // pilot countdown
  const start = data.pilot_start ? new Date(data.pilot_start) : (records.length ? new Date(records.map(r=>r.date).sort()[0]) : new Date());
  const daysElapsed = Math.max(0, Math.floor((Date.now() - start.getTime()) / 86400000));
  const daysLeft = Math.max(0, 14 - daysElapsed);
  document.getElementById('pilotPill').innerHTML =
    `Day <b>${daysElapsed}</b> of 14 &nbsp;&middot;&nbsp; <b>${daysLeft}</b> day(s) until decision time`;

  if (!names.length) {
    document.getElementById('content').innerHTML = '<div class="empty">No channels recorded yet.</div>';
    return;
  }

  // aggregate per channel
  const agg = {};
  names.forEach(n => agg[n] = {views: 0, watch_minutes: 0, subs_gained: 0, likes: 0, days: 0});
  records.forEach(r => {
    if (!agg[r.channel]) return;
    agg[r.channel].views += r.views || 0;
    agg[r.channel].watch_minutes += r.watch_minutes || 0;
    agg[r.channel].subs_gained += r.subs_gained || 0;
    agg[r.channel].likes += r.likes || 0;
    agg[r.channel].days += 1;
  });

  const rows = names.map((n, i) => {
    const c = channels[n];
    const a = agg[n];
    const videoCount = c.video_count || 0;
    // current_total_views (YouTube Data API, near-real-time) is the
    // headline number -- a.views (summed from the Analytics API's per-day
    // reports) lags 24-48h behind, so right after a fresh upload it reads
    // 0 even when the video already has real views. Fall back to the
    // lagged sum only if the live snapshot hasn't been fetched yet.
    const liveViews = c.current_total_views;
    const views = liveViews != null ? liveViews : a.views;
    const avgViews = videoCount ? views / videoCount : (views || 0);
    const estRevenue = c.est_rpm != null ? (views / 1000) * c.est_rpm : null;
    return {
      name: n, niche: c.niche || n, rpm: c.est_rpm, color: seriesColor(i),
      views, watchMinutes: a.watch_minutes, subsGained: a.subs_gained,
      videoCount, avgViews, estRevenue, isLive: liveViews != null,
    };
  }).sort((a,b) => b.views - a.views);

  // stat cards
  const cardsHtml = rows.map(r => `
    <div class="card">
      <span class="rank">#${rows.indexOf(r)+1}</span>
      <div class="niche"><span class="dot" style="background:${r.color}"></span>${r.niche}</div>
      <div class="value">${fmt(r.views)} views${r.isLive ? '' : ' <span style="font-size:0.5em;opacity:0.6">(lagged)</span>'}</div>
      <div class="delta">${r.videoCount} video(s) &middot; ${fmt(r.subsGained)} subs &middot; est. ${money(r.estRevenue)}</div>
    </div>`).join('');

  // bar chart (views by niche)
  const maxViews = Math.max(1, ...rows.map(r => r.views));
  const barsHtml = rows.map(r => `
    <div class="bar-row">
      <div class="bar-label">${r.niche}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(1, r.views/maxViews*100)}%; background:${r.color}"></div></div>
      <div class="bar-value">${fmt(r.views)}</div>
    </div>`).join('');

  // table
  const tableRowsHtml = rows.map(r => `
    <tr>
      <td><span class="legend-dot" style="background:${r.color}"></span>${r.niche}</td>
      <td>${r.videoCount}</td>
      <td>${fmt(r.views)}</td>
      <td>${fmt(r.avgViews)}</td>
      <td>${fmt(r.watchMinutes)}</td>
      <td>${fmt(r.subsGained)}</td>
      <td>${r.rpm != null ? '$'+r.rpm.toFixed(2) : '—'}</td>
      <td>${money(r.estRevenue)}</td>
    </tr>`).join('');

  document.getElementById('content').innerHTML = `
    <section>
      <h2>By channel (${data.records ? data.records.length : 0} daily records, last 14 days)</h2>
      <div class="cards">${cardsHtml}</div>
    </section>
    <section>
      <h2>Total views by niche</h2>
      <div class="chart">${barsHtml}</div>
    </section>
    <section>
      <h2>Full comparison table</h2>
      <div class="chart" style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>Niche</th><th>Videos</th><th>Views</th><th>Avg views/video</th>
            <th>Watch min.</th><th>Subs gained</th><th>Est. RPM</th><th>Est. revenue</th>
          </tr></thead>
          <tbody>${tableRowsHtml}</tbody>
        </table>
      </div>
    </section>`;

  if (data.last_updated) {
    document.getElementById('lastUpdated').textContent = 'Last updated: ' + data.last_updated;
  }
}
main();
</script>
</body>
</html>
