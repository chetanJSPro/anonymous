name: Publish niche episodes

on:
  schedule:
    # Three episodes/day/channel per explicit request 2026-08-28 (6am/2pm/
    # 10pm IST -> 00:30/08:30/16:30 UTC).
    # KNOWN RISK, accepted 2026-08-28: YouTube Data API caps uploads at
    # ~6/day per Google Cloud project (10,000 units/day, ~1,600/upload).
    # client_secret_a.json serves 4 channels (hp01-04) -> 12 uploads/day
    # needed at this cadence, only ~6 fit -> hp01-04 WILL start failing
    # with quota-exceeded on the 3rd run most days (fail-fast: false means
    # it only drops those channels' episodes for the day, doesn't break
    # the others). client_secret_b.json (hp06-08, 3 channels) and
    # client_secret_c.json (ch01/ch03/ch06, 3 channels) need 9/day each,
    # same problem. Only client_secret_d.json (hp09 alone, 3/day) actually
    # fits under the 6/day cap at this cadence. Real fix if this becomes a
    # problem: split hp01-04/hp06-08/ch01+ch03+ch06 across more Google
    # Cloud OAuth projects (needs a human to create the projects + run
    # scripts/generate_token.py locally, can't be done from here) -- or
    # drop back to 1x/day (see the 2026-08-28 revert commit before this one).
    - cron: "30 0 * * *"
    - cron: "30 8 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Run only this channel (blank = all 11)"
        required: false
      upload:
        description: "Actually upload to YouTube (true/false)"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.inputs.channel == '' || github.event.inputs.channel == null }}
    runs-on: ubuntu-latest
    timeout-minutes: 25  # job-level backstop -- generation+upload normally takes a few min
    strategy:
      # Lowered from 4 -- confirmed 2026-08-21 that 4 channels hitting
      # Agnes AI's shared free-tier rate limit simultaneously was enough to
      # 429 every single clip on every channel in that run. Doesn't cost
      # extra Actions minutes (billing is per job-minute regardless of
      # parallelism), just longer wall-clock per scheduled run.
      max-parallel: 1
      fail-fast: false
      matrix:
        channel:
          - hp01_betrayal_revenge
          - hp02_court_drama
          - hp03_karma_justice
          - hp04_veteran_kindness
          # hp05_sleep_soundscapes pulled 2026-08-19 -- see scripts/registry.py
          - hp06_literary_analysis
          - hp07_senior_longevity
          - hp08_english_learning
          - ch01_ai_asmr
          - ch03_hindu_mythology
          - ch06_eastern_philosophy
          - hp09_kids_cartoon_stories
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg + caption font
        # Confirmed 2026-08-19: this step can hang indefinitely (30-45+ min,
        # burning Actions minutes for nothing) on a slow/dead apt mirror --
        # hit 5 of 10 jobs in one run. DEBIAN_FRONTEND=noninteractive avoids
        # a debconf prompt silently blocking on stdin, Acquire::Retries
        # retries a flaky mirror instead of hanging on it once, and
        # timeout-minutes is the hard backstop so a still-stuck step fails
        # fast (job then just fails that one channel, doesn't eat the whole
        # Actions minutes budget) instead of running for hours.
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 ffmpeg fonts-dejavu-core espeak-ng
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Write secrets to files
        env:
          CLIENT_SECRET_A_B64: ${{ secrets.CLIENT_SECRET_A_B64 }}
          CLIENT_SECRET_B_B64: ${{ secrets.CLIENT_SECRET_B_B64 }}
          CLIENT_SECRET_C_B64: ${{ secrets.CLIENT_SECRET_C_B64 }}
          CLIENT_SECRET_D_B64: ${{ secrets.CLIENT_SECRET_D_B64 }}
          TOKEN_HP01_BETRAYAL_REVENGE_B64: ${{ secrets.TOKEN_HP01_BETRAYAL_REVENGE_B64 }}
          TOKEN_HP02_COURT_DRAMA_B64: ${{ secrets.TOKEN_HP02_COURT_DRAMA_B64 }}
          TOKEN_HP03_KARMA_JUSTICE_B64: ${{ secrets.TOKEN_HP03_KARMA_JUSTICE_B64 }}
          TOKEN_HP04_VETERAN_KINDNESS_B64: ${{ secrets.TOKEN_HP04_VETERAN_KINDNESS_B64 }}
          TOKEN_HP05_SLEEP_SOUNDSCAPES_B64: ${{ secrets.TOKEN_HP05_SLEEP_SOUNDSCAPES_B64 }}
          TOKEN_HP06_LITERARY_ANALYSIS_B64: ${{ secrets.TOKEN_HP06_LITERARY_ANALYSIS_B64 }}
          TOKEN_HP07_SENIOR_LONGEVITY_B64: ${{ secrets.TOKEN_HP07_SENIOR_LONGEVITY_B64 }}
          TOKEN_HP08_ENGLISH_LEARNING_B64: ${{ secrets.TOKEN_HP08_ENGLISH_LEARNING_B64 }}
          TOKEN_CH01_AI_ASMR_B64: ${{ secrets.TOKEN_CH01_AI_ASMR_B64 }}
          TOKEN_CH03_HINDU_MYTHOLOGY_B64: ${{ secrets.TOKEN_CH03_HINDU_MYTHOLOGY_B64 }}
          TOKEN_CH06_EASTERN_PHILOSOPHY_B64: ${{ secrets.TOKEN_CH06_EASTERN_PHILOSOPHY_B64 }}
          TOKEN_HP09_KIDS_CARTOON_STORIES_B64: ${{ secrets.TOKEN_HP09_KIDS_CARTOON_STORIES_B64 }}
        run: python scripts/write_secrets.py
      - name: Generate + upload episode
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: python scripts/publish.py ${{ matrix.channel }} --upload
      - name: Commit updated topic/clip dedup state
        # Confirmed 2026-08-21: this step didn't exist before, so
        # core/topics.py's and core/visuals.py's per-channel "already used"
        # history was only ever written to the ephemeral job workspace and
        # thrown away when the job ended -- every scheduled run started
        # from a fresh checkout with no memory of what the last run
        # actually published, silently defeating both topic AND stock-clip
        # dedup in production (screenshots showed multiple episodes
        # publishing the literal same clip run after run despite the code
        # already trying to avoid that). Commits only this matrix job's own
        # two files (data/used_topics/<channel>.json,
        # data/used_clips/<channel>.json), so up to 4 channels running in
        # parallel never touch the same path -- a rebase+retry loop absorbs
        # the case where two jobs still race to push around the same time.
        # if: always() -- pick_topic() records a topic before the script is
        # even generated, so a later step failing (e.g. the upload) can
        # still leave real dedup state worth keeping.
        if: always()
        run: |
          git config user.name "niche-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "data/used_topics/${{ matrix.channel }}.json" "data/used_clips/${{ matrix.channel }}.json" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no dedup state changes to commit"
            exit 0
          fi
          git commit -m "chore: update dedup state for ${{ matrix.channel }} [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin master && git push origin master && exit 0
            echo "push attempt $i failed (likely a race with another channel's job), retrying..."
            sleep $(( (RANDOM % 10) + 5 ))
          done
          echo "::warning::could not push dedup state for ${{ matrix.channel }} after 5 attempts -- next run just won't have this episode's dedup history yet"

  publish-single:
    if: ${{ github.event.inputs.channel != '' && github.event.inputs.channel != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 25  # job-level backstop -- generation+upload normally takes a few min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg + caption font
        # Confirmed 2026-08-19: this step can hang indefinitely (30-45+ min,
        # burning Actions minutes for nothing) on a slow/dead apt mirror --
        # hit 5 of 10 jobs in one run. DEBIAN_FRONTEND=noninteractive avoids
        # a debconf prompt silently blocking on stdin, Acquire::Retries
        # retries a flaky mirror instead of hanging on it once, and
        # timeout-minutes is the hard backstop so a still-stuck step fails
        # fast (job then just fails that one channel, doesn't eat the whole
        # Actions minutes budget) instead of running for hours.
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 ffmpeg fonts-dejavu-core espeak-ng
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Write secrets to files
        env:
          CLIENT_SECRET_A_B64: ${{ secrets.CLIENT_SECRET_A_B64 }}
          CLIENT_SECRET_B_B64: ${{ secrets.CLIENT_SECRET_B_B64 }}
          CLIENT_SECRET_C_B64: ${{ secrets.CLIENT_SECRET_C_B64 }}
          CLIENT_SECRET_D_B64: ${{ secrets.CLIENT_SECRET_D_B64 }}
          TOKEN_HP01_BETRAYAL_REVENGE_B64: ${{ secrets.TOKEN_HP01_BETRAYAL_REVENGE_B64 }}
          TOKEN_HP02_COURT_DRAMA_B64: ${{ secrets.TOKEN_HP02_COURT_DRAMA_B64 }}
          TOKEN_HP03_KARMA_JUSTICE_B64: ${{ secrets.TOKEN_HP03_KARMA_JUSTICE_B64 }}
          TOKEN_HP04_VETERAN_KINDNESS_B64: ${{ secrets.TOKEN_HP04_VETERAN_KINDNESS_B64 }}
          TOKEN_HP05_SLEEP_SOUNDSCAPES_B64: ${{ secrets.TOKEN_HP05_SLEEP_SOUNDSCAPES_B64 }}
          TOKEN_HP06_LITERARY_ANALYSIS_B64: ${{ secrets.TOKEN_HP06_LITERARY_ANALYSIS_B64 }}
          TOKEN_HP07_SENIOR_LONGEVITY_B64: ${{ secrets.TOKEN_HP07_SENIOR_LONGEVITY_B64 }}
          TOKEN_HP08_ENGLISH_LEARNING_B64: ${{ secrets.TOKEN_HP08_ENGLISH_LEARNING_B64 }}
          TOKEN_CH01_AI_ASMR_B64: ${{ secrets.TOKEN_CH01_AI_ASMR_B64 }}
          TOKEN_CH03_HINDU_MYTHOLOGY_B64: ${{ secrets.TOKEN_CH03_HINDU_MYTHOLOGY_B64 }}
          TOKEN_CH06_EASTERN_PHILOSOPHY_B64: ${{ secrets.TOKEN_CH06_EASTERN_PHILOSOPHY_B64 }}
          TOKEN_HP09_KIDS_CARTOON_STORIES_B64: ${{ secrets.TOKEN_HP09_KIDS_CARTOON_STORIES_B64 }}
        run: python scripts/write_secrets.py
      - name: Generate (+ maybe upload) episode
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.upload }}" = "false" ]; then
            python scripts/publish.py ${{ github.event.inputs.channel }}
          else
            python scripts/publish.py ${{ github.event.inputs.channel }} --upload
          fi
      - name: Commit updated topic/clip dedup state
        # See the same-named step in the `publish` job above for why this
        # exists -- without it, per-channel topic/stock-clip dedup history
        # never survives past this single job.
        if: always()
        run: |
          git config user.name "niche-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "data/used_topics/${{ github.event.inputs.channel }}.json" "data/used_clips/${{ github.event.inputs.channel }}.json" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no dedup state changes to commit"
            exit 0
          fi
          git commit -m "chore: update dedup state for ${{ github.event.inputs.channel }} [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin master && git push origin master && exit 0
            echo "push attempt $i failed, retrying..."
            sleep $(( (RANDOM % 10) + 5 ))
          done
          echo "::warning::could not push dedup state for ${{ github.event.inputs.channel }} after 5 attempts"
